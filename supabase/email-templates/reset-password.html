<!--
  Plantilla para Supabase Dashboard → Authentication → Email Templates → Reset Password.
  {{ .ConfirmationURL }} es la variable que inyecta Supabase con el link real; no tocar.
  Reemplazar la URL del <img> por la URL pública real del logo (ver nota en el chat).
-->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restablecer contraseña</title>
  </head>
  <body style="margin:0; padding:0; background-color:#FEE9E6; font-family: 'Poppins', Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FEE9E6; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:24px; overflow:hidden;">
            <tr>
              <td align="center" style="background-color:#F2679C; padding:32px 24px;">
                <img
                  src="https://frutos-lu-app.vercel.app/logos/email-logo.jpg"
                  alt="Frutos Lu"
                  width="88"
                  height="88"
                  style="border-radius:50%; display:block; border:3px solid #ffffff;"
                />
              </td>
            </tr>
            <tr>
              <td style="padding:32px 32px 8px;">
                <p style="margin:0 0 16px; font-size:20px; font-weight:600; color:#1f1f1f;">Restablecé tu contraseña</p>
                <p style="margin:0 0 24px; font-size:15px; line-height:1.5; color:#525252;">
                  Recibimos un pedido para cambiar la contraseña de tu cuenta en <strong>Frutos Lu</strong>. Tocá el botón para elegir una nueva.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 32px 32px;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block; background-color:#F2679C; color:#ffffff; text-decoration:none; font-weight:600; font-size:15px; padding:14px 32px; border-radius:12px;"
                >
                  Restablecer contraseña
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px;">
                <p style="margin:0; font-size:13px; line-height:1.5; color:#a3a3a3;">
                  Si no pediste este cambio, podés ignorar este mail — tu contraseña sigue siendo la misma.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:24px 0 0; font-size:12px; color:#a3a3a3;">Frutos Lu</p>
        </td>
      </tr>
    </table>
  </body>
</html>
